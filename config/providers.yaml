# ============================================================
#  厂商与数据源清单（声明式）
#
#  扩充厂商：在 providers 下追加一段即可（约 10 行）。
#  改完执行：node src/db/migrate.js
#
#  字段说明：
#    slug           唯一英文标识（用于指纹与 URL）
#    name_zh/name_en 中英文名
#    country        CN / US / FR ...
#    cn_accessible  国内是否可直连（差异化字段，竞品普遍缺失）
#    tier           1=核心（优先抓取） 2=次要
#    brand_color    品牌色，用于卡片与徽章
#    sources[]      kind: pricing(定价页) | announcement(公告/新闻) | docs(文档)
#                        | search(搜索兜底) | social(社媒)
#                   url / query
#                   selector  CSS 选择器，限定规则提取的正文范围（可选，默认全页）
#                   enabled    false 可临时停用某个源
# ============================================================

