# ============================================================
#  endpoints.yaml —— 端点清单（三层结构的上层，最小可领取单元）
#
#  语义：某**提供方**在某个**模型**上给出的免费额度。
#    例：google-ai-studio × gemini-3-8-flash = 15 RPM / 1500 RPD / 免绑卡
#
#  与 activities 的区别（易混，务必分清）：
#    endpoint  —— 长期稳定的"免费额度政策"（Google AI Studio 一直给 1500 RPD）
#    activity  —— 有时效的"限时活动"（ZCode 周末送 1 亿，9/7 截止）
#    二者是"常态"与"限时"的关系。
#
#  为什么要有这一层：
#    引入前只有「厂商 → 活动」两层，用户看到"某厂商有免费额度"却不知道
#    "具体能领多少、要不要绑卡、支不支持国内直连"。端点层把这些条件结构化，
#    才能做"免绑卡优先""国内可直连"这类真正有用的筛选。
#
#  字段说明（未标注者为可选）：
#    provider          厂商 slug，须存在于 providers.yaml
#    model             模型 slug，须存在于 models.yaml
#    quota_kind        rate_limit / credits / free_tier / unlimited
#    quota_rpm/rpd/tpm 速率限制（每分钟请求 / 每日请求 / 每分钟 token）
#    quota_amount+unit 额度数值与单位（credits 型使用）
#    requires_card     是否必须绑卡（这个字段最有价值，用户最关心）
#    cn_accessible     国内是否可直连
#    api_base_url      OpenAI 兼容端点，便于直接接入
#    score             评分（可选，必须同时给 score_source）
# ============================================================

