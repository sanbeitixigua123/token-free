# ============================================================
#  models.yaml —— 模型实体清单（三层结构的中层）
#
#  为什么单独一个文件：
#    模型与厂商是**多对多**关系（GLM-5.3-Flash 同时出现在智谱官方、OpenCode、
#    Vultr、AMD 等多家提供方），把模型定义塞进 providers.yaml 会造成大量重复，
#    且改名时极易不同步。独立成文件后，厂商/端点的配置只需引用 model slug。
#
#  capability 取值（对齐业界惯例，便于与同类站点互通）：
#    text-generation / code-generation / image-generation / image-understanding
#    speech-to-text / text-to-speech / text-embeddings / video-generation / translation
#
#  字段说明：
#    slug             全局唯一标识，端点的 model 字段引用它
#    vendor_slug      模型开发方（可能是厂商之外的第三方，如 Meta 的 Llama）
#    name             展示名
#    capability       主能力（用于列表分组与筛选，单值便于建索引）
#    capabilities     全量能力列表（多模态模型填多项）
#    context_window   上下文窗口（token）
#    is_open_weights  是否开源权重
# ============================================================

models:
